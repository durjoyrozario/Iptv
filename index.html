<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Thasadith:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      overflow: hidden;
      font-family: 'Thasadith', sans-serif;
      color: #fff;
    }

    #videoWrapper { position: fixed; inset: 0; }

    #videoPlayer {
      width: 100%; height: 100%;
      object-fit: fill;
      transition: opacity 0.4s ease;
    }

    /* ── TIME (top-left) ── */
    #timebox {
      position: absolute;
      top: 18px; left: 20px;
      font-size: 15px;
      font-weight: 400;
      color: rgba(255,255,255,0.75);
      letter-spacing: 0.5px;
      z-index: 20;
      pointer-events: none;
    }

    /* ── CHANNEL OSD (top-right) ── */
    #channelOSD {
      position: absolute;
      top: 14px; right: 18px;
      display: none;
      flex-direction: column;
      align-items: flex-end;
      gap: 1px;
      z-index: 20;
      pointer-events: none;
    }
    #channelOSD.visible { display: flex; }

    #channelNum {
      font-size: 48px;
      font-weight: 300;
      color: #fff;
      line-height: 1;
      letter-spacing: -1px;
    }
    #channelName {
      font-size: 12px;
      font-weight: 500;
      color: rgba(255,255,255,0.6);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    /* Server badge under channel name */
    #serverBadge {
      font-size: 10px;
      font-weight: 400;
      color: rgba(255,255,255,0.35);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* ── FAV HEART ── */
    #favIndicator {
      position: absolute;
      bottom: 44px; right: 18px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 20;
      pointer-events: none;
    }
    #favIndicator.on { opacity: 0.6; }

    /* ── STATUS DOT (bottom-left) ── */
    #statusWrap {
      position: absolute;
      bottom: 16px; left: 18px;
      display: flex; align-items: center; gap: 6px;
      z-index: 20;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s;
    }
    #statusWrap.show { opacity: 1; }

    #statusDot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #4ade80;
      animation: blink 2s ease-in-out infinite;
    }
    #statusDot.buffering { background: #fbbf24; animation: none; }
    #statusDot.error     { background: #f87171; animation: none; }
    @keyframes blink {
      0%,100% { opacity: 1; } 50% { opacity: 0.3; }
    }

    #statusLabel {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
    }

    /* ── LOADING BAR ── */
    #loadBar {
      position: absolute;
      bottom: 0; left: 0;
      height: 2px;
      background: rgba(255,255,255,0.7);
      width: 0;
      z-index: 30;
      pointer-events: none;
    }
    #loadBar.loading { animation: loadAnim 1.6s ease-in-out infinite; }
    @keyframes loadAnim {
      0%   { left: 0; width: 0; opacity: 1; }
      50%  { left: 0; width: 70%; opacity: 1; }
      100% { left: 70%; width: 30%; opacity: 0; }
    }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      bottom: 50px; left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: rgba(20,20,20,0.9);
      border-radius: 6px;
      padding: 8px 18px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 50;
      pointer-events: none;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── BIG HEART ── */
    #bigHeart {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 80px;
      z-index: 100;
      display: none;
      animation: heartPop 1.6s ease forwards;
    }
    @keyframes heartPop {
      0%   { transform: translate(-50%,-50%) scale(0); opacity: 1; }
      40%  { transform: translate(-50%,-50%) scale(1.2); }
      70%  { transform: translate(-50%,-50%) scale(0.9); opacity: 1; }
      100% { transform: translate(-50%,-50%) scale(1); opacity: 0; }
    }

    /* ── NO SIGNAL ── */
    #noSignal {
      position: fixed; inset: 0;
      background: #000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 10;
    }
    #noSignal.show { display: flex; }
    #noSignalIcon { font-size: 40px; opacity: 0.2; }
    #noSignalText {
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
    }
    #retryDots { display: flex; gap: 6px; margin-top: 4px; }
    #retryDots span {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      animation: dotPulse 1.4s infinite;
    }
    #retryDots span:nth-child(2) { animation-delay: 0.2s; }
    #retryDots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotPulse {
      0%,100% { opacity: 0.2; transform: scale(0.8); }
      50%      { opacity: 1;   transform: scale(1.2); }
    }

    /* ── LAST CHANNEL BADGE ── */
    #lastChBadge {
      position: absolute;
      bottom: 40px; left: 18px;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      z-index: 20;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s;

    #lastChBadge.show { opacity: 1; }

      bottom: 60px; right: 18px;
      font-size: 9px;
      font-weight: 500;

      color: rgba(255,255,255,0.3);
      z-index: 20;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s;
    }
    #serverIndicator.show { opacity: 1; }
  </style>

/* ═══════════════════════════════════════
   STATE
═══════════════════════════════════════ */
let currentIndex   = 0;
let currentSource  = 0;   // which server index within channel.sources
let hls            = null;
let favorites      = [];
let pressTimer     = null;
let isKeyPressed   = false;
let osdTimeout     = null;
let statusTimeout  = null;
let retryTimer     = null;
let reconnectAttempts = 0;
const MAX_RECONNECT   = 6;
let autoFallbackActive = false;

// ── LAST / PREVIOUS CHANNEL ──
let previousIndex = -1;

function loadLastChannel() {
  try {
    const s = localStorage.getItem('lastChannelIndex');
    const i = s !== null ? parseInt(s, 10) : 0;
    return (!isNaN(i) && i >= 0 && i < channels.length) ? i : 0;
  } catch(e) { return 0; }
}
function saveLastChannel(idx) {
  try { localStorage.setItem('lastChannelIndex', idx.toString()); } catch(e) {}
}
function loadLastSource(chIdx) {
  try {
    const s = localStorage.getItem('lastSource_' + chIdx);
    const i = s !== null ? parseInt(s, 10) : 0;
    const max = channels[chIdx].sources.length;
    return (!isNaN(i) && i >= 0 && i < max) ? i : 0;
  } catch(e) { return 0; }
}
function saveLastSource(chIdx, srcIdx) {
  try { localStorage.setItem('lastSource_' + chIdx, srcIdx.toString()); } catch(e) {}
}

let isOffline = false;
let offlineNoSignalTimer = null;

try { favorites = JSON.parse(localStorage.getItem('myFavs')) || []; } catch(e) {}

const video        = document.getElementById('videoPlayer');
const osd          = document.getElementById('channelOSD');
const chNum        = document.getElementById('channelNum');
const chName       = document.getElementById('channelName');
const serverBadge  = document.getElementById('serverBadge');
const loadBar      = document.getElementById('loadBar');
const statusWrap   = document.getElementById('statusWrap');
const statusDot    = document.getElementById('statusDot');
const statusLabel  = document.getElementById('statusLabel');
const favInd       = document.getElementById('favIndicator');
const noSignal     = document.getElementById('noSignal');
const bigHeart     = document.getElementById('bigHeart');
const toastEl      = document.getElementById('toast');
const lastChBadge  = document.getElementById('lastChBadge');
const serverIndEl  = document.getElementById('serverIndicator');

// ── Fullscreen ──
function goFullscreen() {
  const el = document.documentElement;
  (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen || (() => {})).call(el);
}
window.addEventListener('load', () => setTimeout(goFullscreen, 500));

// ── Toast ──
let toastTimer;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000);
}

// ── OSD ──
function showOSD(chIdx, srcIdx) {
  const ch = channels[chIdx];
  chNum.textContent  = String(chIdx + 1).padStart(2, '0');
  chName.textContent = ch.name;
  serverBadge.textContent = ch.sources.length > 1
    ? `${ch.sources[srcIdx].name} · ${srcIdx + 1}/${ch.sources.length}`
    : '';
  osd.classList.add('visible');
  clearTimeout(osdTimeout);
  osdTimeout = setTimeout(() => osd.classList.remove('visible'), 2500);
}

// ── Server indicator (bottom-right) ──
let serverIndTimer;
function showServerIndicator(chIdx, srcIdx) {
  const ch = channels[chIdx];
  if (ch.sources.length <= 1) { serverIndEl.classList.remove('show'); return; }
  serverIndEl.textContent = `${ch.sources[srcIdx].name} ${srcIdx+1}/${ch.sources.length}`;
  serverIndEl.classList.add('show');
  clearTimeout(serverIndTimer);
  serverIndTimer = setTimeout(() => serverIndEl.classList.remove('show'), 3000);
}

// ── Status ──
function setStatus(state, label) {
  statusDot.className = state === 'live' ? '' : state;
  statusLabel.textContent = label || state.toUpperCase();
  statusWrap.classList.add('show');
  clearTimeout(statusTimeout);
  if (state === 'live') {
    statusTimeout = setTimeout(() => statusWrap.classList.remove('show'), 3000);
  }
}

function showNoSignal(show) {
  noSignal.classList.toggle('show', show);
}

function checkFavStatus() {
  favInd.classList.toggle('on', favorites.includes(currentIndex));
}

let lastBadgeTimer;
function showLastChBadge(idx) {
  if (idx < 0) return;
  lastChBadge.textContent = `↩ Last: ${channels[idx].name}`;
  lastChBadge.classList.add('show');
  clearTimeout(lastBadgeTimer);
  lastBadgeTimer = setTimeout(() => lastChBadge.classList.remove('show'), 3000);
}

/* ═══════════════════════════════════════
   CORE STREAM LOADER
   Loads a specific channel + source index.
   If autoFallback=true and it fails → tries next source automatically.
═══════════════════════════════════════ */
function loadSource(chIdx, srcIdx, autoFallback) {
  const ch  = channels[chIdx];
  const src = ch.sources[srcIdx];
  if (!src) { showNoSignal(true); setStatus('error', 'No Signal'); loadBar.className = ''; return; }

  autoFallbackActive = autoFallback;
  currentSource = srcIdx;
  saveLastSource(chIdx, srcIdx);

  video.style.opacity = '0';
  showNoSignal(false);
  loadBar.className = 'loading';
  setStatus('buffering', 'Loading');
  clearTimeout(retryTimer);

  if (hls) { hls.destroy(); hls = null; }

  const url = src.url;

  if (Hls.isSupported()) {
    hls = new Hls({ maxBufferLength: 60, initialLiveManifestSize: 2, enableWorker: true });
    hls.loadSource(url);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      video.play().catch(() => {});
      video.style.opacity = '1';
      loadBar.className = '';
      setStatus('live', 'Live');
      showNoSignal(false);
      reconnectAttempts = 0;
      autoFallbackActive = false;
      showOSD(chIdx, srcIdx);
      showServerIndicator(chIdx, srcIdx);
    });

    hls.on(Hls.Events.ERROR, (event, data) => {
      if (!data.fatal) return;
      if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
        hls.recoverMediaError();
      } else {
        // Fatal network/other error
        if (autoFallback && srcIdx + 1 < ch.sources.length) {
          // Try next source automatically
          const nextSrc = srcIdx + 1;
          showToast(`${ch.sources[srcIdx].name} failed → trying ${ch.sources[nextSrc].name}`);
          setTimeout(() => loadSource(chIdx, nextSrc, true), 800);
        } else {
          scheduleReconnect();
        }
      }
    });

  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = url;
    video.onloadedmetadata = () => {
      video.play().catch(() => {});
      video.style.opacity = '1';
      loadBar.className = '';
      setStatus('live', 'Live');
      showOSD(chIdx, srcIdx);
    };
    video.onerror = () => {
      if (autoFallback && srcIdx + 1 < ch.sources.length) {
        const nextSrc = srcIdx + 1;
        showToast(`Trying ${ch.sources[nextSrc].name}`);
        setTimeout(() => loadSource(chIdx, nextSrc, true), 800);
      } else scheduleReconnect();
    };
  }

  showOSD(chIdx, srcIdx);
  checkFavStatus();
}

/* ═══════════════════════════════════════
   PLAY CHANNEL  (entry point)
═══════════════════════════════════════ */
function playChannel(i, fromBack) {
  i = ((i % channels.length) + channels.length) % channels.length;
  if (!fromBack && i !== currentIndex) previousIndex = currentIndex;
  saveLastChannel(i);
  currentIndex = i;
  reconnectAttempts = 0;
  clearTimeout(offlineNoSignalTimer);

  // Restore last used source for this channel (start from it, auto-fallback if dead)
  const startSrc = loadLastSource(i);
  loadSource(i, startSrc, true);
}

/* ═══════════════════════════════════════
   SWITCH SERVER (OK/Enter short press)
   Moves to the next source manually.
═══════════════════════════════════════ */
function switchNextServer() {
  const ch = channels[currentIndex];
  if (ch.sources.length <= 1) { showToast('Only one server'); return; }
  const nextSrc = (currentSource + 1) % ch.sources.length;
  showToast(`Server: ${ch.sources[nextSrc].name} (${nextSrc + 1}/${ch.sources.length})`);
  loadSource(currentIndex, nextSrc, false);
}

/* ═══════════════════════════════════════
   BACK TO PREVIOUS CHANNEL
═══════════════════════════════════════ */
function goBack() {
  if (previousIndex >= 0 && previousIndex !== currentIndex) {
    showToast(`↩ ${channels[previousIndex].name}`);
    playChannel(previousIndex, true);
  } else {
    showToast('No previous channel');
  }
}

// ── Auto-reconnect ──
function isVideoStillPlaying() {
  if (video.paused || video.ended) return false;
  if (video.buffered.length === 0) return false;
  const bufferedEnd = video.buffered.end(video.buffered.length - 1);
  return (bufferedEnd - video.currentTime) > 2;
}

function scheduleReconnect() {
  if (reconnectAttempts >= MAX_RECONNECT) {
    if (!isVideoStillPlaying()) { showNoSignal(true); setStatus('error', 'No Signal'); }
    loadBar.className = '';
    return;
  }
  reconnectAttempts++;
  const delay = Math.min(1500 * reconnectAttempts, 8000);
  if (isVideoStillPlaying()) {
    setStatus('buffering', `Retry ${reconnectAttempts}/${MAX_RECONNECT}`);
    showNoSignal(false);
  } else {
    setStatus('error', `Retry ${reconnectAttempts}/${MAX_RECONNECT}`);
    showNoSignal(true);
  }
  clearTimeout(retryTimer);
  retryTimer = setTimeout(() => {
    if (navigator.onLine || isVideoStillPlaying()) {
      showNoSignal(false);
      loadSource(currentIndex, currentSource, false);
    } else scheduleReconnect();
  }, delay);
}

// ── Internet events ──
window.addEventListener('online', () => {
  isOffline = false;
  clearTimeout(offlineNoSignalTimer);
  showToast('Internet restored');
  clearTimeout(retryTimer);
  reconnectAttempts = 0;
  setTimeout(() => loadSource(currentIndex, currentSource, true), 600);
});

window.addEventListener('offline', () => {
  isOffline = true;
  setStatus('error', 'No Internet');
  showToast('No internet');
});

// ── Stalled / buffering ──
video.addEventListener('stalled', () => {
  setStatus('buffering', 'Buffering');
  clearTimeout(retryTimer);
  clearTimeout(offlineNoSignalTimer);
  if (isOffline) {
    offlineNoSignalTimer = setTimeout(() => { showNoSignal(true); setStatus('error', 'No Internet'); }, 3000);
  } else {
    retryTimer = setTimeout(() => { if (navigator.onLine) { video.load(); video.play().catch(()=>{}); } }, 3000);
  }
});

video.addEventListener('waiting', () => {
  setStatus('buffering', 'Buffering');
  if (isOffline) {
    clearTimeout(offlineNoSignalTimer);
    offlineNoSignalTimer = setTimeout(() => { showNoSignal(true); setStatus('error', 'No Internet'); }, 4000);
  }
});

video.addEventListener('playing', () => {
  setStatus('live', 'Live');
  showNoSignal(false);
  clearTimeout(offlineNoSignalTimer);
});

// ── Favourites ──
function toggleFavorite() {
  const isFav = favorites.includes(currentIndex);
  bigHeart.style.display = 'block';
  bigHeart.style.animation = 'none';
  void bigHeart.offsetWidth;
  bigHeart.style.animation = 'heartPop 1.6s ease forwards';
  if (!isFav) {
    favorites.push(currentIndex);
    bigHeart.textContent = '❤';
    bigHeart.style.color = '#e05';
    showToast('Added to favorites');
  } else {
    favorites = favorites.filter(id => id !== currentIndex);
    bigHeart.textContent = '💔';
    bigHeart.style.color = '#fff';
    showToast('Removed from favorites');
  }
  try { localStorage.setItem('myFavs', JSON.stringify(favorites)); } catch(e) {}
  setTimeout(() => bigHeart.style.display = 'none', 1700);
  checkFavStatus();
}
/* ═══════════════════════════════════════
   NUMBER KEY — চ্যানেল নম্বর দিয়ে সরাসরি যাও
   টাইপ করো যেমন: 7 → ch7, 25 → ch25
   ৩ সেকেন্ড না টাইপ করলে সেই চ্যানেলে যাবে
═══════════════════════════════════════ */
let numBuffer = '';
let numTimer  = null;
const NUM_TIMEOUT = 2000; // ২ সেকেন্ড

function commitChannelNumber() {
  const n = parseInt(numBuffer, 10);
  numBuffer = '';
  if (isNaN(n) || n < 1 || n > channels.length) {
    showToast('Channel not found');
    hideNumOSD();
    return;
  }
  hideNumOSD();
  playChannel(n - 1);
}

function showNumOSD(buf) {
  // চ্যানেল OSD রিইউজ করো — নম্বর দেখাও
  chNum.textContent  = buf.padStart(2, '0');
  // নম্বরের সাথে চ্যানেল নামও দেখাও যদি valid হয়
  const n = parseInt(buf, 10);
  if (!isNaN(n) && n >= 1 && n <= channels.length) {
    chName.textContent = channels[n - 1].name;
  } else {
    chName.textContent = '—';
  }
  serverBadge.textContent = '';
  osd.classList.add('visible');
  clearTimeout(osdTimeout);
}

function hideNumOSD() {
  osd.classList.remove('visible');
}
/* ═══════════════════════════════════════
   KEYBOARD / REMOTE CONTROL
   Enter (short) = switch server
   Enter (long 2s) = toggle favourite
   Arrow keys = channel navigation
   Backspace/GoBack = previous channel
═══════════════════════════════════════ */
document.addEventListener('keydown', e => {
  if (isKeyPressed) return;
  isKeyPressed = true;
// ── NUMBER KEYS (0-9) ──
  if (e.key >= '0' && e.key <= '9') {
    numBuffer += e.key;
    showNumOSD(numBuffer);
    clearTimeout(numTimer);

    // ২ ডিজিট হয়ে গেলে বা সর্বোচ্চ চ্যানেল নম্বরের ডিজিট পূর্ণ হলে সাথে সাথে যাও
    const maxDigits = channels.length.toString().length;
    if (numBuffer.length >= maxDigits) {
      numTimer = setTimeout(commitChannelNumber, 300); // সামান্য দেরি
    } else {
      numTimer = setTimeout(commitChannelNumber, NUM_TIMEOUT);
    }
    return;
  }
  // অন্য বোতাম টাইপে buffer clear করো
  if (numBuffer && e.key !== 'Enter') {
    clearTimeout(numTimer);
    commitChannelNumber();
  }
  if (e.key === 'Enter') {
    // Start long-press timer for favourite
    pressTimer = setTimeout(() => { toggleFavorite(); pressTimer = null; }, 2000);
  }
  else if (e.key === 'ArrowRight') playChannel(currentIndex + 1);
  else if (e.key === 'ArrowLeft')  playChannel(currentIndex - 1);
  else if (e.key === 'ArrowUp') {
    if (favorites.length > 0) {
      const ci = favorites.indexOf(currentIndex);
      playChannel(favorites[(ci + 1) % favorites.length]);
    } else playChannel(currentIndex + 1);
  }
  else if (e.key === 'ArrowDown') {
    if (favorites.length > 0) {
      const ci = favorites.indexOf(currentIndex);
      playChannel(favorites[(ci - 1 + favorites.length) % favorites.length]);
    } else playChannel(currentIndex - 1);
  }
  else if (e.key === 'Backspace' || e.key === 'GoBack' || e.key === 'BrowserBack') {
    e.preventDefault();
    goBack();
  }
});

document.addEventListener('keyup', e => {
  isKeyPressed = false;
  if (e.key === 'Enter') {
    if (pressTimer) {
      // Short press → switch server
      clearTimeout(pressTimer);
      pressTimer = null;
      switchNextServer();
    }
    // If pressTimer was already cleared (long press fired), do nothing
  }
});

// ── Clock ──
let lastClockMin = -1;
function clockTick() {
  const now = new Date();
  const min = now.getMinutes();
  if (min !== lastClockMin) {
    lastClockMin = min;
    let h = now.getHours(), m = min.toString().padStart(2, '0');
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = (h % 12) || 12;
    document.getElementById('timebox').textContent = `${h}:${m} ${ampm}`;
  }
  requestAnimationFrame(clockTick);
}
requestAnimationFrame(clockTick);

/* ═══════════════════════════════════════
   START
═══════════════════════════════════════ */
const startIndex = loadLastChannel();
if (startIndex > 0) showToast(`Resuming: ${channels[startIndex].name}`);
playChannel(startIndex);
</script>
